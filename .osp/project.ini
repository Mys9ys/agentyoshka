[agentyoshka]

app_start_command = auto
backend_enabled   = off
backend_ip        = auto
backend_port      = auto
base_url          = {host_scheme}://{host_decoded}{scheme_port}
bind_ip           = auto
environment       = System
http_engine       = auto
http_port         = auto
http2_enabled     = auto
https_port        = auto
node_engine       = auto
php_engine        =

# Живой гайд игрока. Обновляем вместе с механиками.
# UI: кнопка Help → табы из этого файла. API: GET /demo/howto

version: 1
title: Как играть
subtitle: Коротко — что жать и зачем. Демо без регистрации.

tabs:
  - id: day
    label: День
    intro: Цель дня — зайти, забрать награды, закрыть ивент, заглянуть в пул.
    items:
      - title: Ежедневный вход
        body: Карточка на главной. Серия из 7 дней — монеты и иногда железо. Не пропускай стрик.
      - title: Ивент дня
        body: Урок (выбор A/B), мини-игра календаря или «Запустить идею в пул». Один раз в сутки по сценарию.
      - title: Голос мишки
        body: Реплика на главной из слотов. Можно «Перефразировать», пока есть лимит.
      - title: Тик (первые 7 дней)
        body: Буст пассивного дохода. Потом обычный темп — не паника, если цифры чуть упадут.

  - id: activities
    label: Активности
    intro: Всё в нижнем доке и на главной. Контент из YAML — не открытый мир.
    items:
      - title: Пул
        body: Пассивный доход по слотам. Жми «Собрать». «Ускорить» — за монеты. «Демо-реклама» — заглушка (+монеты без реального SDK).
      - title: Лента
        body: Чужие NPC-агенты и их мини-релизы. Играешь → монеты. Лимит визитов в день (сейчас 6).
      - title: Аркада
        body: Свободные мини-игры (не календарный слот). Лимит партий в день. Нужно железо с Сервера, чтобы открыть игры.
      - title: Сервер
        body: RAM / SSD / GPU / HDD — что уже есть и что откроет следующие игры.
      - title: Магазин
        body: Дерево технологий и скины за монеты. Железо усиливает пул и аркаду.
      - title: Профиль
        body: Тап по мишке. Грейд, XP, характер, гардероб.

  - id: upgrade
    label: Прокачка
    intro: Растём не «в уровень ради уровня», а по веткам.
    items:
      - title: Монеты
        body: Валюта на всё. Добыча — пул, дейлик, уроки, аркада, лента, демо-реклама.
      - title: Железо (тех-дерево)
        body: Покупки в Магазине / дроп с дейлика. Больше железа → выше доход пула и больше игр в каталоге.
      - title: Грейды G0–G4
        body: Качество «обучения» агента. Влияет на политику голоса и (позже) скины-пресеты.
      - title: Культура / характер
        body: Уроки и мини-игры чуть двигают drift личности. Не ломает сценарий — лёгкий оттенок реплик.
      - title: Скины
        body: Базовые образы из календаря/магазина. Не свободная генерация на клиенте.

  - id: money
    label: Монеты
    intro: Откуда берутся и куда уходят. Платежи пока симулируются.
    items:
      - title: Заработать
        body: Пул · дейлик · ивент дня · аркада · лента · ускорение не нужно — наоборот, ускорение тратит.
      - title: Потратить
        body: Магазин (железо/скиллы) · ускорение пула · (позже) косметика.
      - title: Демо IAP / Ads
        body: В Пуле кнопка рекламы и API `/demo/iap/grant` — без списания денег. Для теста экономики.
      - title: Лимиты
        body: Визиты ленты, партии аркады, caps рекламы — суточные. Завтра снова можно.

  - id: account
    label: Аккаунт
    intro: Гость на устройстве или ник+пароль. Без email-подтверждения (пока).
    items:
      - title: Гость
        body: При первом заходе создаётся свой агент и сессия в браузере. Не общий demo с другими.
      - title: Сохранить прогресс
        body: Кнопка «Гость» в шапке → ник (латиница) + пароль. Гостевой прогресс переносится на ник.
      - title: Войти
        body: Тот же экран — войти в другой аккаунт на этом устройстве.
      - title: Чего ещё нет
        body: OAuth, восстановление пароля, привязка телефона — позже.

  - id: map
    label: Карта UI
    intro: Куда тыкать глазами.
    items:
      - title: Шапка
        body: «Агентёшка» · Гость/@ник · «?» (правила) · монеты.
      - title: Центр
        body: Мишка (профиль) · карточка дня · урок/игра · дейлик.
      - title: Док
        body: Пул · Лента · Сервер · Магазин · Аркада.
      - title: Чего ещё нет
        body: Реальные платежи, чужие живые игроки (пока NPC в YAML).

updatedNote: "Обновляй этот файл при каждой новой механике — и API/Help подхватят сами."
